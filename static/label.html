<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEM — Labelling</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
<h1>Ground-truth labelling</h1>
<nav id="nav-signed-out"><a href="/login">Sign in</a></nav>
<nav id="nav-signed-in"><a href="/">Home</a> · <button id="btn-logout" class="link-btn">Sign out</button></nav>
<p>All times Asia/Kolkata · Labels are immutable; corrections create a new label.</p>
<h2>New label</h2>
<label>Room <input id="room"></label>
<label>Start <input id="start" type="datetime-local"></label>
<label>End <input id="end" type="datetime-local"></label>
<label>State <select id="state"><option>occupied</option><option>vacant</option><option>unsure</option></select></label>
<label>Source <select id="source"><option>spot_check</option><option>scripted_trial</option><option>timetable</option></select></label>
<label>Initials <input id="labeller" size="8"></label>
<label>Note (≤140) <input id="note" size="40"></label>
<button id="add">Add label</button>
<h2>Labels</h2>
<button id="reload">Reload</button>
<table id="labels"><thead><tr><th>Room</th><th>Start</th><th>End</th><th>State</th>
<th>Source</th><th>By</th><th>Note</th><th>Action</th></tr></thead><tbody></tbody></table>
<h2>Conflicts</h2>
<table id="conflicts"><thead><tr><th>Room</th><th>Overlap start</th><th>Overlap end</th>
<th>A</th><th>B</th></tr></thead><tbody></tbody></table>
<h2>Coverage (labelled hours)</h2>
<table id="coverage"><thead><tr><th>Room</th><th>State</th><th>Hours</th></tr></thead><tbody></tbody></table>
<p id="err"></p>
</main>
<script src="/static/api.js"></script>
<script src="/static/label.js"></script>
<script src="/static/auth.js"></script>
</body>
</html>
